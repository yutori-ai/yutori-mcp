# hatchling refuses PEP 508 direct references unless this is set, and the computer-use
# harness is pinned to a private git commit rather than published to an index.
[tool.hatch.metadata]
allow-direct-references = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yutori-mcp"
version = "0.4.0"
description = "MCP server for Yutori - web monitoring, deep research, and browser automation"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Yutori", email = "support@yutori.com" }
]
keywords = ["mcp", "yutori", "web-automation", "browsing", "monitoring"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    # <2.0.0: mcp 2.0.0 restructured mcp.server.fastmcp (the FastMCP/ToolAnnotations
    # API server.py builds on) into a different layout, so an unpinned upper bound
    # breaks the install as soon as 2.x resolves.
    "mcp>=1.0.0,<2.0.0",
    "pydantic>=2.0.0",
    # 0.8.1 adds browsing/research task list methods on both sync and async clients
    "yutori>=0.8.1",
    # The two computer-use runner implementations, both installed while the Python harness
    # is evaluated against the incumbent Node one (select with YUTORI_COMPUTER_USE_HARNESS
    # or the tool's harness parameter; the flag and the losing harness are expected to be
    # removed after the evaluation). Both are private git dependencies because neither is
    # released to any index.
    #
    # The Node runner: pinned to a tag, which is what makes the runtime's own
    # verify_runner() hash check meaningful — never point this at a branch.
    "yutori-computer-use-runtime @ git+ssh://git@github.com/yutori-ai/yutori-sdk-typescript.git@v0.1.5 ; sys_platform == 'darwin'",
    # The Python harness: the reviewed n2 agent loop in Yutori's private Cua mirror,
    # pinned by full commit SHA — the same pin the Python SDK's navigator_n2 cookbooks
    # use. The interpreter markers mirror cua-agent's own requires-python (>=3.11,<3.14):
    # without them a 3.10 install of this package fails to resolve entirely, instead of
    # merely lacking one harness, which preflight reports with a remediation.
    "cua-agent @ git+ssh://git@github.com/yutori-ai/cua-private.git@07f6d2a1836dde25a755b7222310c1e1361f08aa#subdirectory=libs/python/agent ; sys_platform == 'darwin' and python_version >= '3.11' and python_version < '3.14'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.urls]
Homepage = "https://yutori.com"
Documentation = "https://docs.yutori.com"
Repository = "https://github.com/yutori-ai/yutori-mcp"

[project.scripts]
yutori-mcp = "yutori_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/yutori_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
