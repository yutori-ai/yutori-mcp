[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yutori-mcp"
version = "0.5.11"
description = "MCP server and workflow skills for building agents with Yutori"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Yutori", email = "support@yutori.com" }
]
keywords = ["mcp", "yutori", "web-automation", "browsing", "monitoring"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    # <2.0.0: mcp 2.0.0 restructured mcp.server.fastmcp (the FastMCP/ToolAnnotations
    # API server.py builds on) into a different layout, so an unpinned upper bound
    # breaks the install as soon as 2.x resolves.
    "mcp>=1.0.0,<2.0.0",
    "pydantic>=2.0.0",
    # SDK 0.9.13 sends the whole screenshot history: a run's replay shows every
    # step again, instead of stopping after the two frames the old client-side
    # image window left in the request the replay is logged from.
    "yutori==0.9.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.urls]
Homepage = "https://yutori.com"
Documentation = "https://docs.yutori.com"
Repository = "https://github.com/yutori-ai/yutori-mcp"

[project.scripts]
yutori-mcp = "yutori_mcp.entrypoint:main"

[tool.hatch.build.targets.wheel]
packages = ["src/yutori_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
