# hatchling refuses PEP 508 direct references unless this is set, and the computer-use
# runtime is pinned to a private git tag rather than published to an index.
[tool.hatch.metadata]
allow-direct-references = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yutori-mcp"
version = "0.3.1"
description = "MCP server for Yutori - web monitoring, deep research, and browser automation"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Yutori", email = "support@yutori.com" }
]
keywords = ["mcp", "yutori", "web-automation", "browsing", "monitoring"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    # <2.0.0: mcp 2.0.0 restructured mcp.server.fastmcp (the FastMCP/ToolAnnotations
    # API server.py builds on) into a different layout, so an unpinned upper bound
    # breaks the install as soon as 2.x resolves.
    "mcp>=1.0.0,<2.0.0",
    "pydantic>=2.0.0",
    # 0.8.1 adds browsing/research task list methods on both sync and async clients
    "yutori>=0.8.1",
    # Private git dependency rather than an index: the runtime is unreleased, so there is no
    # public PyPI entry and no private index to configure. PEP 508 direct references are the
    # ordinary way to pin a private Python package, and the tag is what makes the runtime's
    # own verify_runner() hash check meaningful — never point this at a branch.
    "yutori-computer-use-runtime @ git+ssh://git@github.com/yutori-ai/yutori-sdk-typescript.git@v0.1.2 ; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.urls]
Homepage = "https://yutori.com"
Documentation = "https://docs.yutori.com"
Repository = "https://github.com/yutori-ai/yutori-mcp"

[project.scripts]
yutori-mcp = "yutori_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/yutori_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
