# hatchling refuses PEP 508 direct references unless this is set, and the computer-use
# SDK is pinned to a private git commit rather than published to an index.
[tool.hatch.metadata]
allow-direct-references = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yutori-mcp"
version = "0.4.0"
description = "MCP server for Yutori - web monitoring, deep research, and browser automation"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Yutori", email = "support@yutori.com" }
]
keywords = ["mcp", "yutori", "web-automation", "browsing", "monitoring"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    # <2.0.0: mcp 2.0.0 restructured mcp.server.fastmcp (the FastMCP/ToolAnnotations
    # API server.py builds on) into a different layout, so an unpinned upper bound
    # breaks the install as soon as 2.x resolves.
    "mcp>=1.0.0,<2.0.0",
    "pydantic>=2.0.0",
    # Pinned to the SDK fork commit that owns the n2 computer-use loop
    # (yutori.navigator.N2ComputerAgent). INTERIM: replace with the plain
    # `yutori>=0.9` index requirement as soon as the SDK ships a release
    # carrying the loop — that removes the last private git dependency from
    # the base install.
    "yutori @ git+ssh://git@github.com/yutori-ai/yutori-sdk-python-private.git@f7b609510f40247ad6b9c4a55ae81fe1a95c8b50",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]
[project.urls]
Homepage = "https://yutori.com"
Documentation = "https://docs.yutori.com"
Repository = "https://github.com/yutori-ai/yutori-mcp"

[project.scripts]
yutori-mcp = "yutori_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/yutori_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
