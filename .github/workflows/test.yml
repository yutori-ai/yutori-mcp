name: Tests

on:
  push:
    branches: [main]
  pull_request:
  # Kept callable so another workflow can reuse this exact matrix as a gate.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      # No floating major tag is published past v7, so pin the exact release.
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # Also hands setup-uv the interpreter so the uv cache key is
          # per-Python; otherwise every matrix leg races on one shared key.
          python-version: ${{ matrix.python-version }}
          # `auto` caches on push/pull_request but skips release and tag pushes,
          # so the publish gate never restores a cache it could be poisoned by.
          enable-cache: auto

      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} --extra dev pytest -q

      - name: Verify the published SDK wheel
        if: matrix.python-version == '3.12'
        env:
          YUTORI_MCP_VERIFY_PUBLISHED_ARTIFACT: "1"
        run: >-
          uv run --python ${{ matrix.python-version }} --extra dev pytest -q
          tests/test_computer_use.py::test_published_sdk_wheel_matches_artifact_hash

      - name: Verify a pip-installed runtime
        if: matrix.python-version == '3.12'
        run: |
          python -m venv "$RUNNER_TEMP/pip-install"
          "$RUNNER_TEMP/pip-install/bin/pip" install .
          "$RUNNER_TEMP/pip-install/bin/python" -c \
            'from yutori_mcp.computer_use.preflight import check_runtime; result = check_runtime(); assert result.ok, result.detail'
